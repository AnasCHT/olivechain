<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OliveChain — Bottle Labels</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/i18n.js"></script>
<style>
  :root{
    --green-deep:#1c2a21; --green-mid:#2c4032; --gold:#c2a24b; --gold-soft:#d9c690;
    --paper:#f2efe6; --ink:#182019; --ink-soft:#4d5a4e; --line:#ddd6c2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Public Sans',sans-serif;background:#e7e2d3;color:var(--ink)}
  .mono{font-family:'IBM Plex Mono',monospace}

  /* ---------- screen toolbar ---------- */
  .bar{background:var(--green-deep);color:var(--paper);padding:14px 22px;display:flex;
    align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
  .bar b{font-family:'Fraunces',serif;font-size:19px}
  .bar .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
  .bar .batch{font-family:'IBM Plex Mono',monospace;font-size:13px;border:1px solid rgba(242,239,230,.35);
    padding:5px 12px}
  .bar select{font-family:'Public Sans',sans-serif;font-size:13px;padding:7px 10px;border-radius:3px;
    border:1px solid rgba(242,239,230,.35);background:var(--green-mid);color:var(--paper)}
  .bar button{font-family:'Public Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--gold);color:var(--green-deep);border:none;padding:9px 22px;border-radius:3px;margin-left:auto}
  .bar a{color:var(--gold-soft);font-size:13px;text-decoration:none}
  .note{max-width:210mm;margin:14px auto 0;padding:0 4px;font-size:12px;color:var(--ink-soft)}
  .err{max-width:210mm;margin:40px auto;text-align:center;color:#b2703a;font-size:15px}

  /* ---------- sheet ---------- */
  .sheet{width:210mm;min-height:297mm;background:#fff;margin:14px auto 40px;
    box-shadow:0 4px 24px rgba(24,32,25,.18);padding:10mm 7mm;display:grid;gap:0}
  .sheet.n12{grid-template-columns:repeat(3,1fr);grid-auto-rows:69mm}
  .sheet.n24{grid-template-columns:repeat(3,1fr);grid-auto-rows:34.5mm}

  .label{border:.35mm dashed #c9c2ac;display:flex;align-items:center;justify-content:center;
    overflow:hidden;padding:3mm;gap:3.5mm}
  .label img{flex:none}
  .n12 .label{flex-direction:column;text-align:center}
  .n12 .label img{width:34mm;height:34mm}
  .n24 .label img{width:24mm;height:24mm}
  .n24 .label .txt{text-align:start}
  html[lang="ar"] .lbrand,html[lang="ar"] .lsub,html[lang="ar"] .lhint{font-family:'Noto Naskh Arabic',serif}
  html[lang="ar"] .lsub{letter-spacing:0}
  .lbrand{font-family:'Fraunces',serif;font-weight:700;font-size:12.5pt;color:var(--green-deep);line-height:1.1}
  .lsub{font-size:6.4pt;letter-spacing:.16em;text-transform:uppercase;color:#8a7325;font-weight:600;margin-top:.6mm}
  .lbatch{font-family:'IBM Plex Mono',monospace;font-size:7.6pt;margin-top:1.4mm;color:var(--ink)}
  .lhint{font-size:6.6pt;color:var(--ink-soft);margin-top:1mm}
  .n12 .lbrand{font-size:14pt}
  .n12 .lbatch{font-size:8.5pt}

  /* ---------- print ---------- */
  @page{size:A4;margin:0}
  @media print{
    body{background:#fff}
    .bar,.note{display:none}
    .sheet{margin:0;box-shadow:none;width:auto;min-height:auto}
    .label{border-color:#ddd}
  }
</style>
</head>
<body>

<div class="bar">
  <span><b>OliveChain</b><div class="tag" id="i-tag">Label sheets</div></span>
  <span class="batch" id="batchId">…</span>
  <select id="size">
    <option value="12" id="i-n12">12 per A4 — large (jars, boxes)</option>
    <option value="24" id="i-n24" selected>24 per A4 — standard bottle</option>
  </select>
  <a href="/" id="backLink">← Dashboard</a>
  <span class="oc-langs" id="langSwitch"></span>
  <button onclick="window.print()" id="i-print">Print sheet</button>
</div>

<p class="note" id="i-note">Each label's QR deep-links to the mobile verifier with this batch pre-filled.
  Print at 100% scale (no "fit to page") so physical sizes are exact. SVG codes stay crisp at any size.</p>

<div class="sheet n24" id="sheet"></div>
<div class="err" id="err" hidden></div>

<script>
const t = OC.t;
const batch = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "");
const safeBatch = batch.replace(/[&<>"']/g,"");
document.getElementById("batchId").textContent = batch;
document.title = "OliveChain — Labels " + batch;

/* static translations */
OC.mountSwitcher(document.getElementById("langSwitch"));
document.getElementById("i-tag").textContent = t("l.tag");
document.getElementById("i-n12").textContent = t("l.n12");
document.getElementById("i-n24").textContent = t("l.n24");
document.getElementById("backLink").textContent = t("l.back");
document.getElementById("i-print").textContent = t("l.print");
document.getElementById("i-note").textContent = t("l.note");

const sheet = document.getElementById("sheet");
const sizeSel = document.getElementById("size");

function render(){
  const n = +sizeSel.value;
  sheet.className = "sheet n" + n;
  const qr = "/qr/" + encodeURIComponent(batch) + ".svg";
  const txt = `
    <div class="txt">
      <div class="lbrand">OliveChain</div>
      <div class="lsub">${t("l.lsub")}</div>
      <div class="lbatch">${safeBatch}</div>
      <div class="lhint">${t("l.lhint")}</div>
    </div>`;
  sheet.innerHTML = Array.from({length:n}, () =>
    `<div class="label"><img src="${qr}" alt="QR ${safeBatch}">${txt}</div>`).join("");
}

fetch("/qr/" + encodeURIComponent(batch) + ".svg").then(r=>{
  if(!r.ok) throw 0;
  render();
  sizeSel.addEventListener("change", render);
}).catch(()=>{
  sheet.hidden = true;
  const e = document.getElementById("err");
  e.hidden = false;
  e.textContent = t("l.err");
});
</script>
</body>
</html>
