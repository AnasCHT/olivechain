name: olivechain-machine1-ca

services:
  ca_peer:
    image: hyperledger/fabric-ca:${FABRIC_CA_VERSION}
    container_name: ca.farmer.olivechain.local
    hostname: ca.farmer.olivechain.local
    restart: unless-stopped
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-farmer
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_CSR_HOSTS: ca.farmer.olivechain.local,${MACHINE_FQDN},localhost,${MACHINE_IP}
    command: sh -c 'fabric-ca-server start -b admin:${CA_ADMIN_PASSWORD} -d'
    ports:
      - "127.0.0.1:7054:7054"
    volumes:
      - ../../runtime/machine1/ca/farmer:/etc/hyperledger/fabric-ca-server
    networks:
      - olivechain

  ca_orderer:
    image: hyperledger/fabric-ca:${FABRIC_CA_VERSION}
    container_name: ca.ordererorg1.olivechain.local
    hostname: ca.ordererorg1.olivechain.local
    restart: unless-stopped
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-ordererorg1
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_CSR_HOSTS: ca.ordererorg1.olivechain.local,${MACHINE_FQDN},localhost,${MACHINE_IP}
    command: sh -c 'fabric-ca-server start -b admin:${ORDERER_CA_ADMIN_PASSWORD} -d'
    ports:
      - "127.0.0.1:8054:7054"
    volumes:
      - ../../runtime/machine1/ca/ordererorg1:/etc/hyperledger/fabric-ca-server
    networks:
      - olivechain

networks:
  olivechain:
    name: olivechain-machine1
